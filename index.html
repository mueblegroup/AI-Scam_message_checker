<!DOCTYPE html>
<html>
<head>
    <title>ScamShield AI - Welcome</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #1e293b, #0f172a, #050814);
            color: white;
            overflow: hidden;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* NAVBAR */
        .nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 18px 25px;
            background: #0b1220;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            transition: 0.2s;
        }

        .nav a:hover {
            color: #22c55e;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            padding: 50px;
            border-radius: 25px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            max-width: 1000px;
            width: 92%;
            position: relative;
            z-index: 2;
            margin-top: 90px; /* IMPORTANT for navbar space */
        }

        .text {
            max-width: 480px;
            z-index: 3;
        }

        h1 {
            font-size: 44px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            min-height: 60px;
            line-height: 1.6;
            font-size: 16px;
        }

        .btn {
            margin-top: 20px;
            padding: 13px 28px;
            background: #22c55e;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(34,197,94,0.5);
        }

        .image {
            flex-shrink: 0;
            z-index: 1;
            animation: float 4s ease-in-out infinite;
        }

        .image img {
            width: 340px;
            max-width: 100%;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.35;
            z-index: 0;
        }

        .g1 {
            width: 240px;
            height: 240px;
            background: #22c55e;
            top: 10%;
            left: 10%;
        }

        .g2 {
            width: 280px;
            height: 280px;
            background: #3b82f6;
            bottom: 10%;
            right: 10%;
        }

        .typing {
            border-right: 2px solid #22c55e;
            display: inline-block;
            white-space: normal;
            word-wrap: break-word;
            overflow: hidden;
        }

        @media(max-width: 768px){
            .container{
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }

            .image img{
                width: 260px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR ADDED -->
<div class="nav">
    <div><b>🛡️ ScamShield AI</b></div>

    <div>
        <a href="home.html">Home</a>
        <a href="checker.html">Checker</a>
        <a href="about.html">About</a>
        <a href="learn.html">Learn</a>
    </div>
</div>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="container">

    <div class="text">
        <h1>🛡️ ScamShield AI</h1>

        <p id="typing" class="typing"></p>

        <a href="#" onclick="startSystem(); return false;">
            <button class="btn">Enter System</button>
        </a>
    </div>

    <div class="image">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="AI Assistant Robot">
    </div>

</div>

<script>
let text = "Hi 👋 I am your AI security assistant. I will help you detect scam messages, phishing links, and fraud attempts in real time without confusion.";
let i = 0;

function type(){
    if(i < text.length){
        document.getElementById("typing").innerHTML += text[i];
        i++;
        setTimeout(type, 25);
    }
}
type();

function speakWelcome() {
    let msg = new SpeechSynthesisUtterance(
        "Hi, welcome to ScamShield AI. I am your AI assistant. How can I help you today?"
    );

    msg.rate = 1;
    msg.pitch = 1;
    msg.volume = 1;

    speechSynthesis.speak(msg);
}

function startSystem() {
    speakWelcome();

    setTimeout(() => {
        window.location.href = "home.html";
    }, 2500);
}
</script>

</body>
</html>
