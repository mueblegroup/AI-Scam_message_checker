<!DOCTYPE html>
<html>
<head>
    <title>Thank You - ScamShield AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #1e293b, #0f172a, #050814);
            color: white;
            overflow: hidden;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            padding: 50px;
            border-radius: 25px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            max-width: 900px;
            width: 92%;
        }

        .text {
            max-width: 450px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            min-height: 60px;
        }

        .btn {
            margin-top: 20px;
            padding: 13px 28px;
            background: #22c55e;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(34,197,94,0.5);
        }

        .image {
            animation: float 4s ease-in-out infinite;
        }

        .image img {
            width: 320px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        @media(max-width:768px){
            .container{
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- TEXT SIDE -->
    <div class="text">

        <h1>🙏 Thank You</h1>

        <p id="text"></p>

        <button class="btn" onclick="speakThanks()">
            🔊 Play Thank You Message
        </button>

        <br><br>

        <a href="index.html">
            <button class="btn">Back to Home</button>
        </a>

    </div>

    <!-- ROBOT -->
    <div class="image">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="AI Robot">
    </div>

</div>

<script>

/* typing effect */
let msg = "Thanks for visiting ScamShield AI. We hope you will visit again. I will always be here to help you detect scams and protect you online.";
let i = 0;

function type(){
    if(i < msg.length){
        document.getElementById("text").innerHTML += msg[i];
        i++;
        setTimeout(type, 25);
    }
}
type();

/* voice */
function speakThanks(){
    let speech = new SpeechSynthesisUtterance(
        "Thank you for visiting ScamShield AI. I hope you will visit me again."
    );

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    speechSynthesis.speak(speech);
}

</script>

</body>
</html>
